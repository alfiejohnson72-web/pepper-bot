{% extends "base.html" %}{% block title %}My account{% endblock %}
{% block content %}
<h1>My account</h1>
<form class="panel" method="post" action="/account" style="max-width:460px"><input type="hidden" name="csrf" value="{{ csrf }}">
<p>Signed in as <b>{{ admin.username }}</b> ({{ admin.role }}).</p>
<label for="c">Current password</label><input id="c" type="password" name="current" autocomplete="current-password" required>
<label for="n">New password (10+ characters)</label><input id="n" type="password" name="new" minlength="10" autocomplete="new-password" required>
<p><button>Change password</button></p></form>
{% endblock %}
