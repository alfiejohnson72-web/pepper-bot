{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block public %}
<div class="panel">
<h1>{{ brand }} admin</h1>
{% if not has_admins %}<p class="flash error">No admin account exists yet. Add ADMIN_USERNAME and ADMIN_PASSWORD in Railway's Variables tab, then restart the service.</p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label for="u">Username</label><input id="u" type="text" name="username" autocomplete="username" required>
<label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required>
<p><button style="width:100%;margin-top:8px">Sign in</button></p>
</form>
</div>
{% endblock %}
